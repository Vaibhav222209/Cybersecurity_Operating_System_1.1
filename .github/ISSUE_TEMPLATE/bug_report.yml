name: 🐛 Bug report
description: Something in Sugreev OS is broken
title: "[Bug]: "
labels: ["bug"]
assignees: ["Vaibhav222209"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **Sugreev OS**! Please fill in as much as you can.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Boot / Login / Power
        - Desktop / Windows / Dock / Top bar
        - Terminal / Shell commands
        - Files
        - Browser
        - SIEM Console
        - Threat Monitor
        - VAPT Lab
        - System Monitor
        - Crypto Toolkit
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in
        2. Open Terminal
        3. Run `...`
        4. See error
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: Chrome 126 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Console output / screenshots
      render: shell
