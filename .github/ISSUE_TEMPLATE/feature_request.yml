name: ✨ Feature request
description: Suggest a new app, command, detection rule or improvement
title: "[Feature]: "
labels: ["enhancement"]
assignees: ["Vaibhav222209"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of feature
      options:
        - New desktop app
        - New terminal command
        - SIEM detection rule / playbook
        - VAPT check / CVE data
        - UI / theme / wallpaper
        - Documentation
        - Other
  - type: checkboxes
    id: terms
    attributes:
      label: Safety
      options:
        - label: This feature stays **simulated** and does not scan or attack real systems.
          required: true
