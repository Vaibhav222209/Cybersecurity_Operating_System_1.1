version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      tooling:
        patterns: ["vite", "@vitejs/*", "typescript", "tailwindcss", "@tailwindcss/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
