<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Sugreev OS — Cybersecurity SIEM and VAPT Operating System">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03070c"/>
      <stop offset="0.55" stop-color="#071624"/>
      <stop offset="1" stop-color="#0a1f2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffa3"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffa3"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00e5ff" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- decorative window chrome on the right -->
  <g transform="translate(790 46)" opacity="0.95">
    <rect width="420" height="268" rx="14" fill="#06111b" stroke="#00e5ff" stroke-opacity="0.35"/>
    <rect width="420" height="30" rx="14" fill="#0b1a28"/>
    <rect y="16" width="420" height="14" fill="#0b1a28"/>
    <circle cx="20" cy="15" r="5" fill="#ff3b5c"/>
    <circle cx="38" cy="15" r="5" fill="#ffb020"/>
    <circle cx="56" cy="15" r="5" fill="#00ffa3"/>
    <text x="210" y="19" fill="#6b8aa3" font-family="Courier New, monospace" font-size="11" text-anchor="middle">vaibhav@sgv-node-01: ~</text>
    <g font-family="Courier New, monospace" font-size="13">
      <text x="18" y="58" fill="#00ffa3">vaibhav@sgv-node-01<tspan fill="#cfe3f1">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#cfe3f1">$ siem status</tspan></text>
      <text x="18" y="80" fill="#00e5ff">Sugreev SIEM v1.0 — node sgv-node-01</text>
      <text x="18" y="100" fill="#8aa5bb">  engine        : <tspan fill="#00ffa3">RUNNING</tspan></text>
      <text x="18" y="118" fill="#8aa5bb">  open alerts   : <tspan fill="#ffb020">3</tspan> (critical: <tspan fill="#ff3b5c">1</tspan>)</text>
      <text x="18" y="136" fill="#8aa5bb">  threat level  : <tspan fill="#38bdf8">GUARDED (18/100)</tspan></text>
      <text x="18" y="164" fill="#00ffa3">vaibhav@sgv-node-01<tspan fill="#cfe3f1">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#cfe3f1">$ vapt scan 192.168.56.101</tspan></text>
      <text x="18" y="186" fill="#00ffa3">[+] 6 open ports, 22 filtered</text>
      <text x="18" y="204" fill="#00ffa3">[+] 2 critical · 1 high · 3 medium</text>
      <text x="18" y="224" fill="#ff3b5c">CVE-2011-2523  9.8  vsftpd 2.3.4 Backdoor</text>
      <text x="18" y="246" fill="#00ffa3">vaibhav@sgv-node-01<tspan fill="#cfe3f1">:~$ </tspan><tspan fill="#00e5ff">█</tspan></text>
    </g>
  </g>

  <!-- shield logo -->
  <g transform="translate(70 70)">
    <circle cx="60" cy="60" r="74" fill="#00e5ff" opacity="0.10" filter="url(#blur)"/>
    <svg width="120" height="120" viewBox="0 0 64 64">
      <path d="M32 5 55 13v17c0 14-10 25-23 29C19 55 9 44 9 30V13z" fill="rgba(0,229,255,0.06)" stroke="url(#shield)" stroke-width="3"/>
      <path d="M41 24c-2-4-7-5-10-4-4 1-6 4-5 7 1 4 6 4 9 5 3 1 4 3 3 6-1 3-6 4-10 2" fill="none" stroke="url(#shield)" stroke-width="4.5" stroke-linecap="round"/>
    </svg>
  </g>

  <text x="220" y="125" fill="url(#neon)" font-family="Orbitron, Impact, Arial Black, sans-serif" font-size="64" font-weight="900" letter-spacing="10">SUGREEV</text>
  <text x="224" y="165" fill="#cfe3f1" font-family="Courier New, monospace" font-size="20" letter-spacing="9">CYBERSECURITY  OPERATING  SYSTEM</text>

  <g font-family="Courier New, monospace" font-size="14" font-weight="bold">
    <rect x="224" y="196" width="74" height="30" rx="6" fill="none" stroke="#00e5ff" stroke-opacity="0.7"/>
    <text x="261" y="216" fill="#00e5ff" text-anchor="middle">SIEM</text>
    <rect x="310" y="196" width="74" height="30" rx="6" fill="none" stroke="#ff3b5c" stroke-opacity="0.7"/>
    <text x="347" y="216" fill="#ff3b5c" text-anchor="middle">VAPT</text>
    <rect x="396" y="196" width="152" height="30" rx="6" fill="none" stroke="#00ffa3" stroke-opacity="0.7"/>
    <text x="472" y="216" fill="#00ffa3" text-anchor="middle">THREAT MAP</text>
    <rect x="560" y="196" width="108" height="30" rx="6" fill="none" stroke="#ffb020" stroke-opacity="0.7"/>
    <text x="614" y="216" fill="#ffb020" text-anchor="middle">TERMINAL</text>
  </g>

  <text x="224" y="272" fill="#6b8aa3" font-family="Courier New, monospace" font-size="15">A Linux-style OS that runs in your browser — built for SOC &amp; pentest learning.</text>
  <text x="224" y="300" fill="#6b8aa3" font-family="Courier New, monospace" font-size="15">Crafted by <tspan fill="#00e5ff">Vaibhav Thakur</tspan>  ·  github.com/<tspan fill="#00ffa3">Vaibhav222209</tspan></text>

  <rect x="0" y="356" width="1280" height="4" fill="url(#neon)"/>
</svg>
